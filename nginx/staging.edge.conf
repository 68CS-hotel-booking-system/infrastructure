# HTTP: phục vụ health check và chuyển người dùng sang HTTPS.
server {
    listen 80;
    server_name staging.hotelbooking.id.vn;

    location = /healthz {
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        return 301 https://staging.hotelbooking.id.vn$request_uri;
    }
}

# HTTPS: chuyển request đến đúng ứng dụng staging.
server {
    listen 443 ssl;
    server_name staging.hotelbooking.id.vn;

    ssl_certificate     /etc/nginx/tls/staging.pem;
    ssl_certificate_key /etc/nginx/tls/staging.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Phân giải tên container qua DNS Docker, cache trong 10 giây.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Alias riêng để tránh nhầm với container production.
    set $frontend http://staging-frontend:80;
    set $backend  http://staging-backend:8080;

    # Chuyển thông tin request gốc tới ứng dụng.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Health của gateway.
    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "OK\n";
    }

    # Giữ nguyên đường dẫn và query khi gọi backend.
    location /api/ {
        proxy_pass $backend$request_uri;
    }

    # Health backend được kiểm tra qua domain công khai.
    location = /actuator/health {
        proxy_pass $backend$request_uri;
        add_header Cache-Control "no-store" always;
    }

    # Các request còn lại chuyển tới frontend.
    location / {
        proxy_pass $frontend$request_uri;
    }
}