server {
    listen 80;
    server_name staging.hotelbooking.id.vn;

    location = /healthz {
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        return 301 https://staging.hotelbooking.id.vn$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name staging.hotelbooking.id.vn;

    ssl_certificate     /etc/nginx/tls/staging.pem;
    ssl_certificate_key /etc/nginx/tls/staging.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Thông tin request được chuyển tới ứng dụng phía sau.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "OK\n";
    }

    # Giữ nguyên đường dẫn /api/v1/... khi chuyển tới backend.
    location /api/ {
        proxy_pass http://backend:8080;
    }

    location = /actuator/health {
        proxy_pass http://backend:8080;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://frontend:80;
    }
}