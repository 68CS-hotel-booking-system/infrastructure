server {
    listen 80;
    server_name staging.hotelbooking.id.vn;

    location = /healthz {
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        return 301 https://staging.hotelbooking.id.vn$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name staging.hotelbooking.id.vn;

    ssl_certificate     /etc/nginx/tls/staging.pem;
    ssl_certificate_key /etc/nginx/tls/staging.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "OK\n";
    }

    # Backend sẽ được nối ở bước tiếp theo.
    location /api/ {
        return 503;
    }

    location = /actuator/health {
        return 503;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
