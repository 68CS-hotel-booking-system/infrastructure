# Loại bỏ query string khỏi access log để không ghi lại token trong URL/Referer cũ.
# Đặt tên riêng để không xung đột khi dùng chung http {} với cấu hình staging.
map $http_referer $production_referer_no_query {
    ~^([^?]+) $1;
    default   "-";
}

log_format no_query_production '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$production_referer_no_query" "$http_user_agent" "$http_x_forwarded_for"';

# HTTP: phục vụ health check và chuyển người dùng sang HTTPS.
server {
    listen 80;
    server_name hotelbooking.id.vn;
    access_log /var/log/nginx/access.log no_query_production;

    location = /healthz {
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        return 301 https://hotelbooking.id.vn$request_uri;
    }
}

# HTTPS: chuyển request đến đúng ứng dụng production.
server {
    listen 443 ssl;
    server_name hotelbooking.id.vn;
    access_log /var/log/nginx/access.log no_query_production;

    ssl_certificate     /etc/nginx/tls/staging.pem;
    ssl_certificate_key /etc/nginx/tls/staging.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Phân giải lại alias khi IP container thay đổi.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Alias riêng của môi trường production.
    set $frontend http://production-frontend:80;
    set $backend  http://production-backend:8080;

    # Chuyển thông tin request gốc tới ứng dụng.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Health của gateway.
    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "OK\n";
    }

    # Chuyển API tới backend, giữ nguyên đường dẫn và query.
    location /api/ {
        proxy_pass $backend$request_uri;
    }

    # Health backend qua domain production.
    location = /actuator/health {
        proxy_pass $backend$request_uri;
        add_header Cache-Control "no-store" always;
    }

    # Các request còn lại chuyển tới frontend.
    location / {
        proxy_pass $frontend$request_uri;
    }
}