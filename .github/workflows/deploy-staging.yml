name: Deploy staging

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - compose.yaml
      - nginx/**
      - .github/workflows/deploy-staging.yml

permissions:
  contents: read

concurrency:
  group: hotel-booking-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Deploy gateway over SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          : "${VPS_HOST:?Missing VPS_HOST}"
          : "${VPS_USER:?Missing VPS_USER}"
          : "${VPS_SSH_KEY:?Missing VPS_SSH_KEY}"
          : "${VPS_KNOWN_HOSTS:?Missing VPS_KNOWN_HOSTS}"

          install -d -m 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" |
            tr -d '\r' > ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_KNOWN_HOSTS" |
            tr -d '\r' > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
          )

          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
            'mkdir -p /opt/hotel-booking/nginx' </dev/null

          scp "${ssh_options[@]}" compose.yaml \
            "$VPS_USER@$VPS_HOST:/opt/hotel-booking/"

          scp "${ssh_options[@]}" nginx/default.conf \
            "$VPS_USER@$VPS_HOST:/opt/hotel-booking/nginx/"

          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          cd /opt/hotel-booking

          docker compose config --quiet
          
          docker compose pull
          docker compose up -d --wait --wait-timeout 120

          docker compose exec -T --interactive=false \
            gateway nginx -t </dev/null

          docker compose exec -T --interactive=false \
            gateway nginx -s reload </dev/null

          docker compose ps
          echo "GATEWAY_DEPLOY_OK"
          REMOTE

      - name: Check public HTTPS
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            https://staging.hotelbooking.id.vn/healthz)"

          if [[ "$response" != "OK" ]]; then
            echo "::error::HTTPS health check did not return OK."
            exit 1
          fi

          echo "HTTPS_OK"
          
      - name: Check frontend
        shell: bash
        run: |
          set -euo pipefail

          html="$(curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            https://staging.hotelbooking.id.vn/)"

          if [[ "$html" != *'id="root"'* ]]; then
            echo "::error::Frontend HTML was not returned."
            exit 1
          fi

          echo "FRONTEND_OK"
