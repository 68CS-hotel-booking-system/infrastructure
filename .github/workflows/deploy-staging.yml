name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      frontend_image:
        description: "Frontend image: ghcr.io/68cs-hotel-booking-system/frontend@sha256:..."
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - compose.yaml
      - nginx/**
      - .github/workflows/deploy-staging.yml

permissions:
  contents: read

concurrency:
  group: hotel-booking-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Deploy frontend over SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          NEW_FRONTEND_IMAGE: ${{ inputs.frontend_image }}
        run: |
          set -euo pipefail

          : "${VPS_HOST:?Missing VPS_HOST}"
          : "${VPS_USER:?Missing VPS_USER}"
          : "${VPS_SSH_KEY:?Missing VPS_SSH_KEY}"
          : "${VPS_KNOWN_HOSTS:?Missing VPS_KNOWN_HOSTS}"

          if [[ -n "$NEW_FRONTEND_IMAGE" ]] && [[ ! "$NEW_FRONTEND_IMAGE" =~ ^ghcr\.io/68cs-hotel-booking-system/frontend@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid frontend image. Use ghcr.io/68cs-hotel-booking-system/frontend@sha256:<64 lowercase hex characters>."
            exit 1
          fi

          install -d -m 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" |
            tr -d '\r' > ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_KNOWN_HOSTS" |
            tr -d '\r' > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=15
          )

          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
            'mkdir -p /opt/hotel-booking/nginx' </dev/null

          scp "${ssh_options[@]}" compose.yaml \
            "$VPS_USER@$VPS_HOST:/opt/hotel-booking/"

          scp "${ssh_options[@]}" nginx/default.conf \
            "$VPS_USER@$VPS_HOST:/opt/hotel-booking/nginx/"

          # The validated image contains no shell metacharacters; an omitted
          # argument means keep the saved image, or discover the running one.
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
            bash -se -- "$NEW_FRONTEND_IMAGE" <<'REMOTE'
          set -euo pipefail
          cd /opt/hotel-booking
          new_image="${1:-}"
          current_image=""

          if [[ -s images.env ]]; then
            current_image="$(sed -n 's/^FRONTEND_IMAGE=//p' images.env | tr -d '\r')"
          else
            frontend_id="$(docker ps -q \
              --filter label=com.docker.compose.project=hotel-booking-staging \
              --filter label=com.docker.compose.service=frontend)"
            if [[ -n "$frontend_id" ]]; then
              current_image="$(docker inspect --format '{{.Config.Image}}' "$frontend_id")"
            fi
          fi

          if [[ -n "$current_image" ]] && [[ ! "$current_image" =~ ^ghcr\.io/68cs-hotel-booking-system/frontend@sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid saved or running frontend image. Expected an image digest from this project's GHCR package."
            exit 1
          fi

          selected_image="${new_image:-$current_image}"
          if [[ ! "$selected_image" =~ ^ghcr\.io/68cs-hotel-booking-system/frontend@sha256:[0-9a-f]{64}$ ]]; then
            echo "No valid frontend image. Run this workflow with frontend_image set to a published image digest."
            exit 1
          fi

          candidate_file="$(mktemp .images.XXXXXX)"
          trap 'rm -f -- "$candidate_file"' EXIT
          printf 'FRONTEND_IMAGE=%s\n' "$selected_image" > "$candidate_file"

          compose() {
            FRONTEND_IMAGE="$selected_image" docker compose --env-file "$candidate_file" "$@"
          }

          compose config --quiet
          compose pull
          compose up -d --wait --wait-timeout 120

          compose exec -T --interactive=false \
            gateway nginx -t </dev/null

          compose exec -T --interactive=false \
            gateway nginx -s reload </dev/null

          compose ps

          # Persist only after local deployment succeeds. Public checks below
          # still determine the final workflow result; rollback is manual.
          if [[ -n "$current_image" && "$current_image" != "$selected_image" ]]; then
            printf 'FRONTEND_IMAGE=%s\n' "$current_image" > images.previous.env
          fi
          mv -- "$candidate_file" images.env
          trap - EXIT

          printf 'FRONTEND_IMAGE=%s\n' "$selected_image"
          echo "GATEWAY_DEPLOY_OK"
          REMOTE

      - name: Check public HTTPS
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            https://staging.hotelbooking.id.vn/healthz)"

          if [[ "$response" != "OK" ]]; then
            echo "::error::HTTPS health check did not return OK."
            exit 1
          fi

          echo "HTTPS_OK"

      - name: Check frontend
        shell: bash
        run: |
          set -euo pipefail

          html="$(curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            https://staging.hotelbooking.id.vn/)"

          if [[ "$html" != *'id="root"'* ]]; then
            echo "::error::Frontend HTML was not returned."
            exit 1
          fi

          echo "FRONTEND_OK"
